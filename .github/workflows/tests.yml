# Runs the tests that need no game files (synthetic inputs or reference implementations only), each one only when a
# pull request touches what it covers. Pushes to test and main, and manual runs, run them all.
name: Tests

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      i18n: ${{ steps.filter.outputs.i18n }}
      layout: ${{ steps.filter.outputs.layout }}
      astc: ${{ steps.filter.outputs.astc }}
      simd: ${{ steps.filter.outputs.simd }}
      translate: ${{ steps.filter.outputs.translate }}
      input: ${{ steps.filter.outputs.input }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            i18n:
              - 'runtime/ui/**'
              - 'runtime/language.c'
              - 'runtime/hle/bindings.c'
              - 'tools/i18n_check.py'
              - '.github/workflows/tests.yml'
            layout:
              - 'tools/*.py'
              - '.github/workflows/tests.yml'
            astc:
              - 'runtime/nvn/astc.c'
              - 'tools/test_astc*'
              - '.github/workflows/tests.yml'
            simd:
              - 'runtime/simd*.h'
              - 'runtime/cpu.h'
              - 'tools/lifter.py'
              - 'tools/simd_c.py'
              - 'tools/test_simd*'
              - '.github/workflows/tests.yml'
            input:
              - 'runtime/hle/input.c'
              - 'runtime/hle/motion.c'
              - 'runtime/hle/vibration.c'
              - 'runtime/hle/bindings.c'
              - 'runtime/hle/swkbd.c'
              - 'runtime/services/hid_set.c'
              - 'runtime/dsu.*'
              - 'runtime/pad_policy.h'
              - 'runtime/input_*.h'
              - 'runtime/motion.h'
              - 'runtime/vibration.h'
              - 'runtime/settings.*'
              - 'tools/test_*'
              - 'tests/**'
              - 'Makefile'
              - '.github/workflows/tests.yml'
            translate:
              - 'runtime/nvn/maxwell/**'
              - 'tools/test_translate*'
              - '.github/workflows/tests.yml'

  # Every text the menus use has a translation in each runtime/ui/i18n/<lang>.inc, and none is left unused.
  i18n:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.i18n == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/i18n_check.py

  # layout.py, gen.py and sw_probe.py agree on synthetic NSOs sized like a big game's (no game code).
  layout:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.layout == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/tests.yml
      - run: uv run --no-project --with lz4 --with capstone --with unicorn python tools/test_layout.py

  # runtime/nvn/astc.c against ARM's astcenc. test_astc.sh clones astcenc's default branch when build/astc-encoder is
  # missing; a pinned release here keeps the reference the same between runs.
  astc:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.astc == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTCENC_VERSION: 5.7.0
    steps:
      - uses: actions/checkout@v7
      - run: git clone --quiet --depth 1 --branch "$ASTCENC_VERSION" https://github.com/ARM-software/astc-encoder.git build/astc-encoder
      - run: bash tools/test_astc.sh

  # The lifter's FP/SIMD lowering against Unicorn (a Cortex-A57), on random encodings and operands (no game code).
  simd:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.simd == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/tests.yml
      - run: uv run --no-project --with unicorn --with capstone python tools/test_simd.py --jobs "$(nproc)"

  # Controllers, motion, vibration, bindings: synthetic streams and SDL's own virtual joysticks, no game files, no
  # hardware. Against the SDL the Linux release ships (tools/linux/build_deps.sh).
  input:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.input == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDL_VERSION: 3.4.16
      SDL_SHA256: 7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends clang lld cmake ninja-build zlib1g-dev
      - uses: actions/cache@v4
        id: sdl
        with:
          path: build/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}
      - if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/sdl3.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz"
          echo "$SDL_SHA256  /tmp/sdl3.tar.gz" | sha256sum -c --quiet
          tar -xf /tmp/sdl3.tar.gz -C /tmp
          cmake -S "/tmp/SDL3-$SDL_VERSION" -B /tmp/sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib \
                -DCMAKE_INSTALL_PREFIX="$PWD/build/sdl3" -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/sdl3-build
          cmake --install /tmp/sdl3-build
      - run: LIBRARY_PATH="$PWD/build/sdl3/lib" LD_LIBRARY_PATH="$PWD/build/sdl3/lib" make -j"$(nproc)" B=build/ci DEPS="$PWD/build/sdl3" test-input

  # Every GLSL translation of random Maxwell programs compiles (shaderc) and validates (SPIRV-Tools).
  translate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.translate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libshaderc-dev spirv-tools
      - run: sh tools/test_translate.sh 20000 "$(nproc)" glsl
